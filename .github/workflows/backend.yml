# Lint und Tests des Backends. Windows läuft mit, weil das Backend auf einem Windows-Mini-PC laufen soll.
name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Abhängigkeiten
        run: uv sync --locked

      - name: ruff
        if: runner.os == 'Linux'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest
