# Lint und Tests des Python-Teils (Phase 1: Gerüst; ab Phase 2 der KI-Worker).
name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Abhängigkeiten
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest
