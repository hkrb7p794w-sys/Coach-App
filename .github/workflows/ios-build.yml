# Baut die unsignierte .ipa für SideStore und hängt sie an ein GitHub-Release.
#
# - Push auf main (nach jedem Merge): Release „vX.Y.<Lauf>“ und Bereitstellung für SideStore über den
#   Worker (Workers KV, private Quelle). SideStore erkennt Updates an der höheren Versionsnummer und meldet
#   sie (docs/sidestore.md).
# - Pull Request: Label „ios-build“ setzen (wird beim Start wieder entfernt, erneutes Setzen startet
#   einen neuen Build). Ergebnis und Fehler landen als Kommentar im PR; Release als Vorabversion.
# - manuell: Actions › iOS Build › Run workflow
name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

  workflow_dispatch:
    inputs:
      run_tests:
        description: Unit-Tests im Simulator ausführen
        type: boolean
        default: true
      prerelease:
        description: Release als Vorabversion markieren
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ios-build-${{ github.ref }}-${{ github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ios-build'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      XCODE_MAJOR: "26"
      LOG: ${{ github.workspace }}/build.log
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Label entfernen
        if: github.event_name == 'pull_request'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ios-build" || true

      # Bei Label-Builds den aktuellen PR-Kopf bauen: Das Ereignis kann einen älteren Stand nennen,
      # wenn das Label direkt nach einem Push gesetzt wurde.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - name: Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_"$XCODE_MAJOR"*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | tee -a "$LOG"

      - name: Werkzeuge installieren
        run: brew install xcodegen ldid 2>&1 | tee -a "$LOG"

      - name: Projekt erzeugen
        working-directory: ios
        run: xcodegen generate 2>&1 | tee -a "$LOG"

      - name: Version bestimmen
        run: |
          BASE=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' ios/project.yml | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION="$BASE"
            TAG="v${VERSION}-pr${PR}.${GITHUB_RUN_NUMBER}"
          else
            # Patch-Stelle = Laufnummer: steigt mit jedem Build, SideStore vergleicht major.minor.patch.
            VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "TAG=$TAG"
            echo "SHORT_SHA=$SHORT_SHA"
          } >> "$GITHUB_ENV"

      - name: Unit-Tests (Simulator)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(part) for part in key.rsplit("iOS-", 1)[1].split("-")]
          for runtime in sorted((k for k in devices if "iOS-" in k), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("kein iPhone-Simulator gefunden")
          ')
          xcodebuild test \
            -project ios/Coach.xcodeproj -scheme Coach \
            -destination "id=$UDID" \
            2>&1 | tee -a "$LOG"

      - name: Archiv bauen (unsigniert)
        run: |
          xcodebuild archive \
            -project ios/Coach.xcodeproj -scheme Coach -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Coach.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$VERSION" \
            2>&1 | tee -a "$LOG"

      - name: IPA packen
        run: |
          APP="$RUNNER_TEMP/Coach.xcarchive/Products/Applications/Coach.app"
          test -d "$APP"
          # Pseudo-Signatur mit Entitlements: SideStore liest daraus, welche Rechte die App
          # anfordert. Ohne sie sähe SideStore das HealthKit-Entitlement gar nicht.
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.dylib' -o -name '*.framework' \) | while read -r item; do
              if [ -d "$item" ]; then ldid -S "$item/$(basename "$item" .framework)"; else ldid -S "$item"; fi
            done
          fi
          # Widget-Erweiterung (Live-Aktivität) ebenfalls pseudo-signieren.
          if [ -d "$APP/PlugIns" ]; then
            for ext in "$APP"/PlugIns/*.appex; do ldid -S "$ext/$(basename "$ext" .appex)"; done
          fi
          ldid -Sios/Coach/Resources/Coach.entitlements "$APP/Coach"
          echo "Entitlements der IPA:" | tee -a "$LOG"
          ldid -e "$APP/Coach" | tee -a "$LOG"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Coach.ipa" Payload)
          ls -lh Coach.ipa

      - name: Für SideStore bereitstellen (Workers KV)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: 103715a4f0004a398c9e75637a2edf36
        run: |
          # Das Repo ist privat: SideStore lädt IPA und Quelle über den Worker (worker/src/sidestore.ts).
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare-Secrets fehlen – keine Bereitstellung für SideStore"
            exit 0
          fi
          git log -1 --format=%B > notes.txt
          python3 - <<'PY'
          import datetime, json, os
          notes = open("notes.txt", encoding="utf-8").read().split("\nCo-Authored-By")[0].strip()
          info = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD_NUMBER"],
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": notes[:2000],
              "size": os.path.getsize("Coach.ipa"),
          }
          json.dump(info, open("release.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat release.json
          WRANGLER="npx --yes wrangler@4.152.0"
          ICON=ios/Coach/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          $WRANGLER kv key put --namespace-id "$KV_ID" --remote Coach.ipa --path Coach.ipa
          $WRANGLER kv key put --namespace-id "$KV_ID" --remote icon.png --path "$ICON"
          # Zuletzt die Versionsangaben, damit die Quelle nie auf eine fehlende IPA zeigt.
          $WRANGLER kv key put --namespace-id "$KV_ID" --remote release.json --path release.json

      - name: Release anlegen
        env:
          PRERELEASE: ${{ github.event_name == 'pull_request' || inputs.prerelease }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$TAG" Coach.ipa \
            --target "$TARGET_SHA" \
            --title "Coach $VERSION" \
            --notes "Unsignierte IPA für SideStore. Commit $SHORT_SHA, Build $BUILD_NUMBER." \
            "${FLAGS[@]}"

      - name: Erfolg im PR melden
        if: success() && github.event_name == 'pull_request'
        run: |
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -f body="✅ iOS-Build $BUILD_NUMBER ($SHORT_SHA) erfolgreich: [$TAG]($URL)"

      - name: Fehler im PR melden
        if: failure() && github.event_name == 'pull_request'
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          touch "$LOG"
          {
            echo "❌ iOS-Build fehlgeschlagen ([Run]($RUN_URL))"
            echo
            echo '```'
            grep -E 'error:|\*\* [A-Z ]+ FAILED \*\*|Test .* failed|✘|Expectation failed' "$LOG" | cut -c1-400 | head -60
            echo '```'
            echo
            echo '<details><summary>Log-Ende</summary>'
            echo
            echo '```'
            tail -150 "$LOG" | cut -c1-400
            echo '```'
            echo '</details>'
          } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md

      - name: Log sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
