# KI-Worker (Cloudflare): Lint, Typen und Tests bei PRs; Deploy auf main bzw. manuell.
# Der Deploy läuft nur, wenn die Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# COACH_APP_TOKEN und mindestens einer der KI-Keys (GEMINI_API_KEY, GROQ_API_KEY) hinterlegt sind.
name: Worker

on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COACH_APP_TOKEN: ${{ secrets.COACH_APP_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Secrets prüfen
        id: secrets
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$COACH_APP_TOKEN" ] || missing+=(COACH_APP_TOKEN)
          [ -n "$GEMINI_API_KEY$GROQ_API_KEY" ] || missing+=("GEMINI_API_KEY oder GROQ_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Deploy übersprungen – fehlende Secrets: ${missing[*]} (siehe docs/einrichtung.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # Nur gesetzte KI-Keys als Worker-Secret übertragen.
          names="COACH_APP_TOKEN"
          [ -n "$GEMINI_API_KEY" ] && names="$names"$'\n'"GEMINI_API_KEY"
          [ -n "$GROQ_API_KEY" ] && names="$names"$'\n'"GROQ_API_KEY"
          { echo "names<<EOF"; echo "$names"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Abhängigkeiten
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npm ci

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: npm
          secrets: ${{ steps.secrets.outputs.names }}

      - name: Adresse für die App
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### KI-Worker bereitgestellt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresse für die App (Einstellungen › KI-Worker): \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/v1/health" >> "$GITHUB_STEP_SUMMARY" || echo "Health-Check noch nicht erreichbar" >> "$GITHUB_STEP_SUMMARY"
