[project]
name = "coach-backend"
version = "0.1.0"
description = "Backend der Coach-App: Garmin-Sync, Regeln und KI-Aufrufe"
readme = "README.md"
# garminconnect >= 0.3.19 setzt Python >= 3.12 voraus.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette empfiehlt für den TestClient ein Nachfolgepaket von httpx; bis das etabliert ist,
# bleibt httpx und nur diese Warnung wird ausgeblendet.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
