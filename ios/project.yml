# XcodeGen-Spezifikation – das .xcodeproj wird daraus erzeugt und nicht eingecheckt.
# Doku: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Coach
options:
  bundleIdPrefix: io.github.hkrb7p794w
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode-26-Standard für neue Projekte: Code läuft ohne Annotation auf dem MainActor,
    # nonisolated async bleibt beim Aufrufer (SE-0461).
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
packages:
  CoachCore:
    path: Packages/CoachCore
targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Coach
      - path: Shared
    dependencies:
      - package: CoachCore
      - sdk: HealthKit.framework
      # Live-Aktivität der laufenden Einheit (Sperrbildschirm, Dynamic Island).
      - target: CoachWidgets
    entitlements:
      path: Coach/Resources/Coach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Coach/Resources/Info.plist
      properties:
        CFBundleDisplayName: IronLudi
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Einladungslink zur Rangliste: coach://join?worker=…&token=…&league=…
        CFBundleURLTypes:
          - CFBundleURLName: io.github.hkrb7p794w.coach.invite
            CFBundleURLSchemes:
              - coach
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.hkrb7p794w.coach.refresh
        NSHealthShareUsageDescription: >-
          IronLudi liest Workouts, Schlaf, Herzfrequenz, Schritte, Kalorien, VO2max und
          Gewicht aus Apple Health (z. B. von der Apple Watch), um Erholung, Training
          und Ernährung einzuordnen.
        NSHealthUpdateUsageDescription: >-
          IronLudi speichert deine Krafttrainings als Workouts in Health.
        NSCameraUsageDescription: >-
          IronLudi nutzt die Kamera für Fotos von Mahlzeiten und zum Scannen von Barcodes.
        NSMicrophoneUsageDescription: >-
          IronLudi nutzt das Mikrofon, wenn du eine Mahlzeit diktierst.
        NSSpeechRecognitionUsageDescription: >-
          IronLudi wandelt deine diktierte Mahlzeit in Text um, wenn möglich direkt auf dem iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hkrb7p794w.coach
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
  # Widget-Erweiterung nur für die Live-Aktivität. Kostet bei SideStore mit kostenloser Apple-ID eine zusätzliche
  # App-ID (10 je 7 Tage), siehe docs/decisions.md.
  CoachWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CoachWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: CoachWidgets/Info.plist
      properties:
        CFBundleDisplayName: IronLudi
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hkrb7p794w.coach.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoachTests
    dependencies:
      - target: Coach
      - package: CoachCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  CoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoachUITests
    dependencies:
      - target: Coach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Coach
        # XCTestCase ist nicht an den MainActor gebunden; nur die Testmethode läuft dort.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  # Nur für den Workflow „Screenshots“: UI-Test mit Beispieldaten.
  Screenshots:
    build:
      targets:
        Coach: all
        CoachUITests: [test]
    test:
      targets:
        - CoachUITests
  Coach:
    build:
      targets:
        Coach: all
        CoachTests: [test]
    test:
      targets:
        - CoachTests
    archive:
      config: Release
